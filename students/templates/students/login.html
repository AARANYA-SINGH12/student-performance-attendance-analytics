{% extends 'base.html' %}
{% block title %}Login - Student Performance Analytics{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-header text-center">
                <h4><i class="bi bi-lock-fill"></i> Login</h4>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Login</button>
                    </div>
                    <div class="text-center mt-3">
                        <a href="{% url 'student_register' %}" class="text-decoration-none">Don't have an account? Register as Student</a>
                    </div>
                </form>
            </div>
        </div>
        <div class="card mt-3">
            <div class="card-body">
                <small class="text-muted">
                    <strong>Demo Credentials:</strong><br>
                    Teacher/Admin: teacher / teacher123<br>
                    Students: st001/st002/.../st010 / student123
                </small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
