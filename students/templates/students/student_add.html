{% extends 'base.html' %}
{% block title %}Add Student{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <i class="bi bi-person-plus"></i> Add New Student
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="{{ form.student_id.id_for_label }}" class="form-label">Student ID</label>
                            {{ form.student_id }}
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="{{ form.name.id_for_label }}" class="form-label">Full Name</label>
                            {{ form.name }}
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="{{ form.email.id_for_label }}" class="form-label">Email</label>
                            {{ form.email }}
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="{{ form.phone.id_for_label }}" class="form-label">Phone</label>
                            {{ form.phone }}
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="{{ form.course.id_for_label }}" class="form-label">Course</label>
                        {{ form.course }}
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="{{ form.semester.id_for_label }}" class="form-label">Semester</label>
                            {{ form.semester }}
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="{{ form.division.id_for_label }}" class="form-label">Division</label>
                            {{ form.division }}
                        </div>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'student_list' %}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Add Student</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
