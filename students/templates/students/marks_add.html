{% extends 'base.html' %}
{% block title %}Add Marks{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">Add Marks</div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Student</label>
                        {{ form.student }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Subject</label>
                        {{ form.subject }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Internal Marks</label>
                        {{ form.internal_marks }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Assignment Marks</label>
                        {{ form.assignment_marks }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Practical Marks</label>
                        {{ form.practical_marks }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label">External Marks</label>
                        {{ form.external_marks }}
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="{% url 'marks_list' %}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
